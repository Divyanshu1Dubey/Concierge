[phases.setup]
nixPkgs = ["python311", "uv"]

[phases.install]
cmds = [
  "mkdir -p config",
  "test -f config/concierge.toml || cp config/concierge.toml.example config/concierge.toml 2>/dev/null || true",
  "uv sync --frozen"
]

[start]
cmd = "uv run uvicorn saas.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*' --no-access-log"
