version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../outbox:/app/outbox
    environment:
      - APP_ENV=production
      - APP_URL=${APP_URL:-http://localhost:8000}
      - API_URL=${API_URL:-http://localhost:8000}
      - WIDGET_URL=${WIDGET_URL:-http://localhost:8000}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-32-char-key}
      - DATABASE_URL=data/saas.db
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DEFAULT_SMTP_HOST=${DEFAULT_SMTP_HOST:-}
      - DEFAULT_SMTP_PORT=${DEFAULT_SMTP_PORT:-}
      - DEFAULT_SMTP_USER=${DEFAULT_SMTP_USER:-}
      - DEFAULT_SMTP_PASSWORD=${DEFAULT_SMTP_PASSWORD:-}
      - DEFAULT_SMTP_FROM=${DEFAULT_SMTP_FROM:-}
      - DEFAULT_SMTP_REPLY_TO=${DEFAULT_SMTP_REPLY_TO:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
