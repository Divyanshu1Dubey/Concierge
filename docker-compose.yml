version: '3.9'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://heyjarvis:heyjarvis@db:5432/heyjarvis
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - APP_URL=http://localhost:8000
      - API_URL=http://localhost:8000
      - WIDGET_URL=http://localhost:8000
      - CORS_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=heyjarvis
      - POSTGRES_PASSWORD=heyjarvis
      - POSTGRES_DB=heyjarvis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heyjarvis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
