# Railway deploy for concierge.heyjarvis.ai. Builds the Dockerfile (start command is its CMD).
# Needs a volume mounted at /data with DATABASE_URL=/data/saas.db, and exactly one replica:
# the mailbox/follow-up scheduler runs inside the web process.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 60
