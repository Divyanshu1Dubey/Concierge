[project]
name = "concierge"
version = "0.1.0"
description = "HeyJarvis Concierge: multi-tenant AI chatbot platform for appointment-based businesses"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0",
    "groq>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "gunicorn>=21.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "cryptography>=42",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
concierge = "concierge.cli:main"
heyjarvis = "saas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concierge", "src/saas"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
pythonpath = ["src"]
asyncio_mode = "auto"
