# Render deploy for the HeyJarvis Concierge backend (concierge.heyjarvis.ai).
#
# Must stay on a paid plan with a disk: the free plan has no persistent disk (the
# SQLite database would be wiped on every deploy/restart) and sleeps when idle
# (the chat loads slowly and the mailbox/follow-up scheduler stops).
# Run exactly ONE instance: the mailbox scheduler runs inside the web process.
services:
  - type: web
    name: concierge
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src uvicorn saas.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: concierge-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: /data/saas.db
      - key: CONCIERGE_MODEL
        value: gemini-3.8-flash
      - key: CONCIERGE_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      # Generated once by Render. Never change it after launch: clinic mailbox
      # credentials are encrypted with it.
      - key: ENCRYPTION_KEY
        generateValue: true
      # Set these in the Render dashboard as secrets (never commit them):
      # APP_URL               https://concierge.heyjarvis.ai
      # GEMINI_API_KEY        from https://aistudio.google.com/apikey
      # DEFAULT_SMTP_HOST / DEFAULT_SMTP_PORT / DEFAULT_SMTP_USER / DEFAULT_SMTP_PASSWORD /
      # DEFAULT_SMTP_FROM     HeyJarvis sending address for staff login codes and invites
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET   optional, for "Sign in with Google"
