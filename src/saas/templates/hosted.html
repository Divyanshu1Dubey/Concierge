<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concierge - {tenant_name}</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #f6f7f8; color: #222; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; display: grid; gap: 16px; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 18px; box-shadow: 0 6px 14px rgba(0,0,0,.06); }
  .launch { display: inline-block; margin-top: 10px; padding: 12px 14px; background: #1f3b2e; color: #fff; border-radius: 12px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>{tenant_name} Concierge</h1>
      <p>Chat with our front desk assistant.</p>
      <div id="concierge-form"></div>
    </div>
  </div>
  <script>
    window.__HJ_CONFIG = window.__HJ_CONFIG || {};
    window.__HJ_CONFIG.clientKey = '{client_key}';
  </script>
  <script src="/widget.js" defer></script>
</body>
</html>
