<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f3b2e">
<meta name="description" content="{tenant_name} — AI-powered front desk assistant. Chat with us to book appointments, ask questions, and get help.">
<meta name="keywords" content="concierge, appointment booking, front desk, chat assistant">
<meta property="og:title" content="{tenant_name} Concierge">
<meta property="og:description" content="Chat with our AI front desk assistant">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{tenant_name} Concierge">
<meta name="twitter:description" content="Chat with our AI front desk assistant">
<title>{tenant_name} — Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3a2a24;
    --accent: #3a2a24;
    --accent-light: #7c8c6e;
    --bg: #efe4d6;
    --surface: #fbf8f3;
    --border: #ece4d9;
    --text: #2a211d;
    --muted: #7d726b;
    --user-bubble: #3a2a24;
    --bot-bubble: #f0ebe5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font: 14px/1.5 'Inter', system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at 20% 30%, #fffdf9 0%, rgba(255,253,249,0) 55%), linear-gradient(135deg, #f7efe4 0%, #efe2d1 55%, #e8d6c1 100%);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 860px;
    margin: 0 auto;
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--border);
  }
  .header {
    flex-shrink: 0;
    padding: 16px 20px;
    background: #fbf8f3; color: #2a211d; border-bottom: 1px solid #ece4d9;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-brand {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: #efe6d2;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header-text { min-width: 0; }
  .header-title {
    font-weight: 700; font-size: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .header-sub {
    font-size: 12px; opacity: .85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .header-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid #ece4d9;
    background: transparent;
    color: #2a211d;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .icon-btn:hover { background: #f1ebe3; }
  .body {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 82%;
    padding: 10px 15px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.55;
    word-wrap: break-word;
    overflow-wrap: break-word;
    animation: fadeIn .22s ease;
  }
  .bubble.bot { align-self: flex-start; background: var(--bot-bubble); color: var(--text); border-bottom-left-radius: 6px; }
  .bubble.user { align-self: flex-end; background: var(--user-bubble); color: #fff; border-bottom-right-radius: 6px; }
  .bubble.system { align-self: center; background: #fff; border: 1px dashed var(--border); color: var(--muted); font-size: 12px; padding: 8px 12px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .typing {
    align-self: flex-start;
    display: flex; gap: 5px; padding: 8px 10px;
    background: var(--bot-bubble); border-radius: 18px; border-bottom-left-radius: 6px;
  }
  .typing span {
    width: 8px; height: 8px; background: #bbb; border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-7px); }
  }
  .options {
    align-self: flex-start;
    display: flex; flex-wrap: wrap; gap: 8px;
    max-width: 82%;
  }
  .chip {
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    background: #fff;
    color: var(--primary);
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: var(--accent); background: #e4ddd4; }
  .chip.picked { border-color: var(--accent); background: #e4ddd4; }
  .footer {
    flex-shrink: 0;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    background: #fff;
  }
  .input {
    flex: 1;
    font: 14px/1.4 inherit;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    outline: none;
    background: #fafafa;
    color: var(--text);
    min-width: 0;
  }
  .input:focus { border-color: var(--accent); background: #fff; }
  .input:disabled { opacity: .5; }
  .send {
    border: none;
    border-radius: 12px;
    background: #3a2a24;
    color: #fff;
    padding: 10px 16px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: opacity .15s;
    flex-shrink: 0;
  }
  .send:disabled { opacity: .4; cursor: not-allowed; }
  .form-card {
    align-self: stretch;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    font: 14px/1.5 inherit;
    padding: 10px 13px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: #fafafa;
    color: var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); background: #fff; }
  .field textarea { resize: vertical; min-height: 80px; }
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    text-align: center;
    padding: 24px;
  }
  .empty-state .icon { font-size: 38px; }
  @media (max-width: 420px) {
    .header { padding: 12px 14px; }
    .body { padding: 10px; }
    .bubble { max-width: 88%; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-brand" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <div class="header-text">
        <div class="header-title" id="title">{tenant_name} Concierge</div>
        <div class="header-sub">Front Desk Assistant</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="resetBtn" aria-label="Reset chat" title="Reset">&#8635;</button>
      </div>
    </header>

    <div class="body" id="hj-body">
      <div class="empty-state" id="empty">
        <div class="icon"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div><strong style="font-size:16px">Welcome to {tenant_name}</strong></div>
        <div style="color:var(--muted);font-size:13px;margin-bottom:12px">How can our front desk team assist you today?</div>
        <div class="options" style="justify-content:center;margin-top:6px">
          <button class="chip" type="button" onclick="quickSend('I would like to book an appointment')">Book an appointment</button>
          <button class="chip" type="button" onclick="quickSend('I have urgent tooth pain')">Emergency pain</button>
          <button class="chip" type="button" onclick="quickSend('Do you accept dental insurance?')">Insurance & pricing</button>
          <button class="chip" type="button" onclick="quickSend('I need to reschedule an existing appointment')">Reschedule visit</button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <input class="input" id="msg" type="text" autocomplete="off" placeholder="Type a message..." aria-label="Message" maxlength="2000"/>
      <button class="send" id="send">Send</button>
    </footer>
  </div>

  <script>
    window.__HJ_CONFIG = window.__HJ_CONFIG || {};
    window.__HJ_CONFIG.clientKey = '{client_key}';
    window.__HJ_CONFIG.hosted = true;
    function quickSend(txt) {
      if (window.__hjHostedSend) { window.__hjHostedSend(txt); return; }
      var m = document.getElementById('msg');
      var s = document.getElementById('send');
      if (m && s) { m.value = txt; s.click(); }
    }
  </script>
  <script src="/widget.js?v=20261007" defer></script>
</body>
</html>
